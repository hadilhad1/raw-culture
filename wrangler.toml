name = "raw-culture"
main = "worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./frontend/dist"

# SPA routing is handled in worker.js to avoid intercepting API requests like /api/*.

# Set BACKEND_URL in Cloudflare to the public Express API origin, without a trailing slash.

[[d1_databases]]
binding = "raw_culture_db"
database_name = "raw-culture-db"
database_id = "d36983ba-9b33-4eb5-bca6-70cc17241bce"

[[r2_buckets]]
binding = "PRODUCT_MEDIA_BUCKET"
bucket_name = "raw-culture-product-media"